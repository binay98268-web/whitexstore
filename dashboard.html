<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — WHITE X STORE</title>
<link rel="stylesheet" href="assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.dash-wrap {
  max-width: 1100px;
  margin: 40px auto;
  padding: 0 20px;
}
.welcome-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
  backdrop-filter: blur(10px);
}
.welcome-box h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px;
  margin-bottom: 8px;
}
.welcome-box h1 span {
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}
.welcome-box p {
  opacity: 0.7;
  font-size: 15px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(10px);
  text-align: center;
  transition: transform 0.3s;
}
.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 25px var(--accent);
}
.stat-icon {
  font-size: 32px;
  margin-bottom: 10px;
}
.stat-label {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  color: var(--accent);
  font-weight: 700;
}
.action-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 150px;
  padding: 16px;
  background: linear-gradient(135deg, var(--accent), #0077ff);
  color: #fff;
  text-decoration: none;
  text-align: center;
  border-radius: 12px;
  font-weight: 700;
  transition: box-shadow 0.3s;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
}
.action-btn:hover {
  box-shadow: 0 0 25px var(--accent);
}
.action-btn.secondary {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
}
.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.empty-state {
  text-align: center;
  padding: 50px 20px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 16px;
  opacity: 0.7;
}
.empty-state h3 {
  font-size: 18px;
  margin-bottom: 8px;
}
.empty-state p {
  font-size: 14px;
  margin-bottom: 20px;
}
.order-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.order-item h4 {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  margin-bottom: 6px;
}
.order-item small {
  opacity: 0.6;
  font-size: 12px;
}
.status-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}
.status-pending {
  background: rgba(255,200,0,0.2);
  color: #ffcc00;
  border: 1px solid #ffcc00;
}
.status-completed {
  background: rgba(50,255,100,0.15);
  color: #22dd66;
  border: 1px solid #22dd66;
}
@media (max-width: 768px) {
  .welcome-box h1 { font-size: 22px; }
  .stat-value { font-size: 20px; }
}
</style>
</head>
<body>

<canvas id="wall3d"></canvas>

<nav class="navbar">
  <div class="logo"><span class="logo-x">X</span> WHITE X STORE</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Store</a>
    <a href="#" id="logoutBtn" style="color:#ff5555;">Logout</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<div class="dash-wrap">

  <div class="welcome-box">
    <h1>Welcome, <span id="userName">User</span>! 👋</h1>
    <p>📧 <span id="userEmail">-</span></p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-label">Wallet Balance</div>
      <div class="stat-value" id="walletBalance">Rs 0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📦</div>
      <div class="stat-label">Total Orders</div>
      <div class="stat-value" id="totalOrders">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔑</div>
      <div class="stat-label">My Keys</div>
      <div class="stat-value" id="totalKeys">0</div>
    </div>
  </div>

  <div class="action-bar">
    <a href="products.html" class="action-btn">🛒 Buy Products</a>
    <a href="#" class="action-btn secondary" id="addMoneyBtn">💰 Add Money</a>
    <a href="index.html" class="action-btn secondary">🏠 Go Home</a>
  </div>

  <h2 class="section-title">📦 My Orders</h2>

  <div id="ordersBox">
    <div class="empty-state">
      <h3>No Orders Yet</h3>
      <p>Go to the store and make your first purchase!</p>
      <a href="products.html" class="action-btn" style="display:inline-block;max-width:250px;">🛒 Browse Store</a>
    </div>
  </div>

</div>

<script src="assets/script.js"></script>
<script>
// Login check
const token = localStorage.getItem('token');
const userStr = localStorage.getItem('user');

if (!token || !userStr) {
  alert('Please login first!');
  window.location.href = 'login.html';
}

const user = JSON.parse(userStr || '{}');

// Fill user data
document.getElementById('userName').textContent = user.name || 'User';
document.getElementById('userEmail').textContent = user.email || '-';
document.getElementById('walletBalance').textContent = 'Rs ' + (user.wallet || 0).toFixed(2);

// Logout
document.getElementById('logoutBtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (confirm('Do you want to logout?')) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
  }
});

// Add money (placeholder)
document.getElementById('addMoneyBtn').addEventListener('click', (e) => {
  e.preventDefault();
  alert('💰 Wallet topup coming soon!\n\nFor now, contact admin.');
});

// Load orders (next step)
async function loadOrders() {
  try {
    const res = await fetch('/api/orders', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) return;

    const data = await res.json();
    const orders = data.orders || [];

    document.getElementById('totalOrders').textContent = orders.length;

    if (orders.length > 0) {
      document.getElementById('ordersBox').innerHTML = orders.map(o => `
        <div class="order-item">
          <div>
            <h4>${o.product_name || 'Product'}</h4>
            <small>Order #${o.id} • ${new Date(o.created_at).toLocaleDateString()}</small>
          </div>
          <div style="text-align:right;">
            <div style="color: var(--accent); font-weight:700; margin-bottom:6px;">Rs ${o.amount}</div>
            <span class="status-badge status-${o.status}">${o.status.toUpperCase()}</span>
          </div>
        </div>
      `).join('');
    }
  } catch (err) {
    console.log('Orders not loaded:', err.message);
  }
}

loadOrders();
</script>

</body>
</html>
