<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — WHITE X STORE</title>
<link rel="stylesheet" href="assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.form-wrap {
  max-width: 420px;
  margin: 60px auto;
  padding: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(10px);
}
.form-wrap h2 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  margin-bottom: 30px;
  font-size: 26px;
}
.form-wrap h2 span {
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 14px;
}
.form-group input {
  width: 100%;
  padding: 14px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border 0.3s;
}
body.light .form-group input {
  background: rgba(255,255,255,0.7);
}
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent);
}
.submit-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent), #0077ff);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
  transition: box-shadow 0.3s;
}
.submit-btn:hover {
  box-shadow: 0 0 25px var(--accent);
}
.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.msg {
  text-align: center;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  display: none;
}
.msg.error {
  background: rgba(255,50,50,0.15);
  color: #ff5555;
  border: 1px solid #ff5555;
  display: block;
}
.msg.success {
  background: rgba(50,255,100,0.15);
  color: #22dd66;
  border: 1px solid #22dd66;
  display: block;
}
.bottom-link {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}
.bottom-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>

<canvas id="wall3d"></canvas>

<nav class="navbar">
  <div class="logo"><span class="logo-x">X</span> WHITE X STORE</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Store</a>
    <a href="login.html">Login</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<div class="form-wrap">
  <h2>Create <span>Account</span></h2>

  <form id="registerForm">
    <div class="form-group">
      <label>👤 Full Name</label>
      <input type="text" id="name" placeholder="अपना नाम डालो" required>
    </div>

    <div class="form-group">
      <label>📧 Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>

    <div class="form-group">
      <label>🔒 Password</label>
      <input type="password" id="password" placeholder="कम से कम 6 अक्षर" minlength="6" required>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">🚀 Register</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="bottom-link">
    पहले से account है? <a href="login.html">Login करो</a>
  </div>
</div>

<script src="assets/script.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = '⏳ Registering...';
  msg.className = 'msg';
  msg.style.display = 'none';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();

    if (res.ok) {
      msg.className = 'msg success';
      msg.textContent = '✅ Account बन गया! Login page पर भेज रहे हैं...';
      msg.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    } else {
      throw new Error(data.error || 'Registration failed');
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = '❌ ' + err.message;
    msg.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '🚀 Register';
});
</script>

</body>
</html>
