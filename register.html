<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — WHITE X STORE</title>
<link rel="stylesheet" href="assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.form-wrap {
  max-width: 460px;
  margin: 50px auto;
  padding: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(10px);
}
.form-wrap h2 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  margin-bottom: 30px;
  font-size: 26px;
}
.form-wrap h2 span {
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 14px;
}
.form-group input,
.form-group select {
  width: 100%;
  padding: 14px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
body.light .form-group input,
body.light .form-group select {
  background: rgba(255,255,255,0.7);
}
.form-group input:focus,
.form-group select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent);
}
.form-group select option {
  background: #0a0a0f;
  color: #fff;
}
body.light .form-group select option {
  background: #fff;
  color: #000;
}

/* CAPTCHA BOX */
.captcha-box {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 18px;
  cursor: pointer;
  user-select: none;
  transition: all 0.3s;
}
body.light .captcha-box {
  background: rgba(255,255,255,0.6);
}
.captcha-box:hover {
  border-color: var(--accent);
}
.captcha-box.checked {
  background: rgba(50,255,100,0.1);
  border-color: #22dd66;
}
.captcha-check {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: transparent;
  flex-shrink: 0;
  transition: all 0.3s;
}
.captcha-box.checked .captcha-check {
  background: #22dd66;
  border-color: #22dd66;
  color: #fff;
}
.captcha-label {
  font-weight: 600;
  font-size: 15px;
  flex: 1;
}
.captcha-badge {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--accent);
  opacity: 0.7;
  font-weight: 700;
}
.captcha-box.loading .captcha-check {
  border-color: var(--accent);
  border-top-color: transparent;
  animation: spin 0.7s linear infinite;
  color: transparent;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.submit-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent), #0077ff);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
  transition: box-shadow 0.3s;
}
.submit-btn:hover {
  box-shadow: 0 0 25px var(--accent);
}
.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.msg {
  text-align: center;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  display: none;
}
.msg.error {
  background: rgba(255,50,50,0.15);
  color: #ff5555;
  border: 1px solid #ff5555;
  display: block;
}
.msg.success {
  background: rgba(50,255,100,0.15);
  color: #22dd66;
  border: 1px solid #22dd66;
  display: block;
}
.bottom-link {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}
.bottom-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
@media (max-width: 500px) {
  .form-wrap { margin: 30px 15px; padding: 25px; }
}
</style>
</head>
<body>

<canvas id="wall3d"></canvas>

<nav class="navbar">
  <div class="logo"><span class="logo-x">X</span> WHITE X STORE</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Store</a>
    <a href="login.html">Login</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<div class="form-wrap">
  <h2>Create <span>Account</span></h2>

  <form id="registerForm">
    <div class="form-group">
      <label>👤 Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label>📧 Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>

    <div class="form-group">
      <label>📱 Phone Number</label>
      <input type="tel" id="phone" placeholder="+977 9800000000" required>
    </div>

    <div class="form-group">
      <label>🌍 Country</label>
      <select id="country" required>
        <option value="">Select your country</option>
        <option value="Nepal">🇳🇵 Nepal</option>
        <option value="India">🇮🇳 India</option>
        <option value="Pakistan">🇵🇰 Pakistan</option>
        <option value="Bangladesh">🇧🇩 Bangladesh</option>
        <option value="Sri Lanka">🇱🇰 Sri Lanka</option>
        <option value="Bhutan">🇧🇹 Bhutan</option>
        <option value="Maldives">🇲🇻 Maldives</option>
        <option value="Afghanistan">🇦🇫 Afghanistan</option>
        <option value="United States">🇺🇸 United States</option>
        <option value="United Kingdom">🇬🇧 United Kingdom</option>
        <option value="Canada">🇨🇦 Canada</option>
        <option value="Australia">🇦🇺 Australia</option>
        <option value="UAE">🇦🇪 UAE</option>
        <option value="Saudi Arabia">🇸🇦 Saudi Arabia</option>
        <option value="Malaysia">🇲🇾 Malaysia</option>
        <option value="Singapore">🇸🇬 Singapore</option>
        <option value="Indonesia">🇮🇩 Indonesia</option>
        <option value="Philippines">🇵🇭 Philippines</option>
        <option value="Vietnam">🇻🇳 Vietnam</option>
        <option value="Thailand">🇹🇭 Thailand</option>
        <option value="China">🇨🇳 China</option>
        <option value="Japan">🇯🇵 Japan</option>
        <option value="South Korea">🇰🇷 South Korea</option>
        <option value="Germany">🇩🇪 Germany</option>
        <option value="France">🇫🇷 France</option>
        <option value="Italy">🇮🇹 Italy</option>
        <option value="Spain">🇪🇸 Spain</option>
        <option value="Brazil">🇧🇷 Brazil</option>
        <option value="Russia">🇷🇺 Russia</option>
        <option value="Other">🌐 Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>🔒 Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
    </div>

    <!-- CAPTCHA BOX -->
    <div class="captcha-box" id="captchaBox">
      <div class="captcha-check" id="captchaCheck">✓</div>
      <div class="captcha-label">I'm not a robot</div>
      <div class="captcha-badge">SECURE</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">🚀 Register</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="bottom-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script src="assets/script.js"></script>
<script>
// CAPTCHA LOGIC
let captchaVerified = false;
const captchaBox = document.getElementById('captchaBox');

captchaBox.addEventListener('click', () => {
  if (captchaVerified || captchaBox.classList.contains('loading')) return;

  captchaBox.classList.add('loading');

  setTimeout(() => {
    captchaBox.classList.remove('loading');
    captchaBox.classList.add('checked');
    captchaVerified = true;
  }, 1200);
});

// REGISTER FORM
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  if (!captchaVerified) {
    msg.className = 'msg error';
    msg.textContent = '❌ Please verify you are not a robot';
    msg.style.display = 'block';
    return;
  }

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const country = document.getElementById('country').value;
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = '⏳ Registering...';
  msg.className = 'msg';
  msg.style.display = 'none';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, country, password })
    });

    const data = await res.json();

    if (res.ok) {
      msg.className = 'msg success';
      msg.textContent = '✅ Account created! Redirecting to login...';
      msg.style.display = 'block';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    } else {
      throw new Error(data.error || 'Registration failed');
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = '❌ ' + err.message;
    msg.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '🚀 Register';
});
</script>

</body>
</html>
