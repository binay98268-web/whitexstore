<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — WHITE X STORE</title>
<link rel="stylesheet" href="assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.form-wrap {
  max-width: 420px;
  margin: 60px auto;
  padding: 40px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(10px);
}
.form-wrap h2 {
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  margin-bottom: 30px;
  font-size: 26px;
}
.form-wrap h2 span {
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent);
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 14px;
}
.form-group input {
  width: 100%;
  padding: 14px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
body.light .form-group input {
  background: rgba(255,255,255,0.7);
}
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent);
}

/* CAPTCHA BOX */
.captcha-box {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 18px;
  cursor: pointer;
  user-select: none;
  transition: all 0.3s;
}
body.light .captcha-box {
  background: rgba(255,255,255,0.6);
}
.captcha-box:hover {
  border-color: var(--accent);
}
.captcha-box.checked {
  background: rgba(50,255,100,0.1);
  border-color: #22dd66;
}
.captcha-check {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: transparent;
  flex-shrink: 0;
  transition: all 0.3s;
}
.captcha-box.checked .captcha-check {
  background: #22dd66;
  border-color: #22dd66;
  color: #fff;
}
.captcha-label {
  font-weight: 600;
  font-size: 15px;
  flex: 1;
}
.captcha-badge {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--accent);
  opacity: 0.7;
  font-weight: 700;
}
.captcha-box.loading .captcha-check {
  border-color: var(--accent);
  border-top-color: transparent;
  animation: spin 0.7s linear infinite;
  color: transparent;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.submit-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--accent), #0077ff);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
}
.submit-btn:hover {
  box-shadow: 0 0 25px var(--accent);
}
.submit-btn:disabled {
  opacity: 0.6;
}
.msg {
  text-align: center;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  display: none;
}
.msg.error {
  background: rgba(255,50,50,0.15);
  color: #ff5555;
  border: 1px solid #ff5555;
  display: block;
}
.msg.success {
  background: rgba(50,255,100,0.15);
  color: #22dd66;
  border: 1px solid #22dd66;
  display: block;
}
.bottom-link {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}
.bottom-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>
<body>

<canvas id="wall3d"></canvas>

<nav class="navbar">
  <div class="logo"><span class="logo-x">X</span> WHITE X STORE</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="products.html">Store</a>
    <a href="register.html">Register</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<div class="form-wrap">
  <h2>Welcome <span>Back</span></h2>

  <form id="loginForm">
    <div class="form-group">
      <label>📧 Email</label>
      <input type="email" id="email" placeholder="your@email.com" required>
    </div>

    <div class="form-group">
      <label>🔒 Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>

    <!-- CAPTCHA BOX -->
    <div class="captcha-box" id="captchaBox">
      <div class="captcha-check" id="captchaCheck">✓</div>
      <div class="captcha-label">I'm not a robot</div>
      <div class="captcha-badge">SECURE</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">🔓 Login</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="bottom-link">
    Don't have an account? <a href="register.html">Register</a>
  </div>
</div>

<script src="assets/script.js"></script>
<script>
// CAPTCHA LOGIC
let captchaVerified = false;
const captchaBox = document.getElementById('captchaBox');

captchaBox.addEventListener('click', () => {
  if (captchaVerified || captchaBox.classList.contains('loading')) return;

  captchaBox.classList.add('loading');

  setTimeout(() => {
    captchaBox.classList.remove('loading');
    captchaBox.classList.add('checked');
    captchaVerified = true;
  }, 1200);
});

// LOGIN FORM
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  if (!captchaVerified) {
    msg.className = 'msg error';
    msg.textContent = '❌ Please verify you are not a robot';
    msg.style.display = 'block';
    return;
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = '⏳ Logging in...';
  msg.className = 'msg';
  msg.style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      msg.className = 'msg success';
      msg.textContent = '✅ Login successful! Redirecting...';
      msg.style.display = 'block';

      setTimeout(() => {
        if (data.user.is_reseller || data.user.email === 'admin@whitex.com') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 1200);
    } else {
      throw new Error(data.error || 'Login failed');
    }
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = '❌ ' + err.message;
    msg.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '🔓 Login';
});
</script>

</body>
</html>
